{% extends "movies/base.html" %}
{% block title %}电影列表{% endblock %}
{% block content %}
<div class="card card-tech p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0"><i class="fa-solid fa-list me-2 text-primary"></i>电影列表</h5>
    <span class="text-muted-tech small">封面图来自：{{ MEDIA_URL|default:"/media/" }}</span>
  </div>

  <div class="row g-3">
    {% for m in movies %}
      <div class="col-md-6 col-lg-4">
        <a class="text-decoration-none" href="{% url 'movies:movie_detail' m.pk %}">
          <div class="card card-tech p-3 h-100">
            {% if m.cover %}
              <img src="{{ m.cover.url }}" class="img-fluid rounded-3 mb-2" alt="cover">
            {% else %}
              <div class="rounded-3 mb-2 d-flex align-items-center justify-content-center"
                   style="height:160px;border:1px dashed #c7d8ff;background:#f3f7ff;">
                <span class="text-muted-tech"><i class="fa-regular fa-image me-1"></i>无封面</span>
              </div>
            {% endif %}

            <div class="fw-semibold">{{ m.title }}</div>
            <div class="text-muted-tech small">{{ m.created_at|date:"Y-m-d H:i" }}</div>
          </div>
        </a>
      </div>
    {% empty %}
      <div class="text-muted-tech p-4">暂无数据</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
