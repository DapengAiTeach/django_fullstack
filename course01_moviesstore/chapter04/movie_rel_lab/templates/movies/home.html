{% extends "movies/base.html" %}
{% block title %}首页 - 关系模型实验室{% endblock %}
{% block content %}
<div class="card card-tech p-4">
  <h3 class="mb-2"><i class="fa-solid fa-diagram-project me-2"></i>三大关系模型一锅端</h3>
  <p class="text-muted-tech mb-3">
    你将看到：导演-电影（一对多）、用户-Profile（一对一）、订单-电影（多对多 + 中间表额外字段）。
  </p>
  <div class="d-flex gap-2">
    <a class="btn btn-primary" href="{% url 'movies:movie_list' %}">
      <i class="fa-solid fa-list me-2"></i>查看电影列表
    </a>
    <a class="btn btn-outline-light" href="{% url 'movies:order_create' %}">
      <i class="fa-solid fa-cart-plus me-2"></i>创建订单（需登录）
    </a>
  </div>
</div>
{% endblock %}
