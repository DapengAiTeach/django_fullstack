{% extends "movies/base.html" %}
{% block title %}电影列表{% endblock %}
{% block content %}
<div class="card card-tech p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0"><i class="fa-solid fa-list me-2"></i>电影列表</h5>
    <span class="text-muted-tech small">一对多：Movie → Director（select_related）</span>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>标题</th>
          <th>导演</th>
          <th>价格</th>
          <th>创建</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for m in movies %}
        <tr>
          <td class="fw-semibold">{{ m.title }}</td>
          <td>{{ m.director.name }}</td>
          <td>{{ m.price }}</td>
          <td class="text-muted-tech">{{ m.created_at|date:"Y-m-d" }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-light" href="{% url 'movies:movie_detail' m.pk %}">
              详情 <i class="fa-solid fa-angle-right ms-1"></i>
            </a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="text-center text-muted-tech py-5">暂无数据</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
