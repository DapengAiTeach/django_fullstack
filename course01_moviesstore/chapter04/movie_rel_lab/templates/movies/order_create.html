{% extends "movies/base.html" %}
{% block title %}创建订单{% endblock %}
{% block content %}
<div class="card card-tech p-4">
  <h5 class="mb-3"><i class="fa-solid fa-cart-plus me-2"></i>创建订单（多对多 + 中间表）</h5>

  <form method="post" class="vstack gap-3">
    {% csrf_token %}

    <div>
      <label class="form-label text-muted-tech">{{ form.movie_ids.label }}</label>
      <div class="d-flex flex-wrap gap-2">
        {{ form.movie_ids }}
      </div>
    </div>

    <div>
      <label class="form-label text-muted-tech">{{ form.quantity.label }}</label>
      {{ form.quantity }}
      <div class="form-text text-muted-tech">
        中间表额外字段：quantity / deal_price
      </div>
    </div>

    <button class="btn btn-primary">
      <i class="fa-solid fa-check me-2"></i>提交订单
    </button>

    <div class="text-muted-tech small">
      提示：该页面需要登录（login_required）。你可先去 /admin/ 创建用户并登录后台，或在项目里加登录页。
    </div>
  </form>
</div>
{% endblock %}
