{% load static %}
<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Todo ORM Lab{% endblock %}</title>

    <!-- BootCDN：国内访问友好 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0c0f;
            --panel: #111318;
            --line: rgba(255, 255, 255, .08);
            --text: rgba(255, 255, 255, .86);
            --muted: rgba(255, 255, 255, .55);
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-main {
            flex: 1;
        }

        .card, .table, .modal-content {
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .navbar {
            border-bottom: 1px solid var(--line);
            background: rgba(17, 19, 24, .75);
            backdrop-filter: blur(10px);
        }

        .footerbar {
            border-top: 1px solid var(--line);
            background: rgba(17, 19, 24, .75);
            backdrop-filter: blur(10px);
        }

        .table th, .table td {
            border-color: var(--line) !important;
        }

        .text-muted {
            color: var(--muted) !important;
        }

        .btn-outline-light {
            border-color: var(--line);
        }

        .form-control, .form-select {
            background: #0f1116;
            border: 1px solid var(--line);
            color: var(--text);
        }

        .form-control:focus, .form-select:focus {
            border-color: rgba(255, 255, 255, .2);
            box-shadow: none;
        }
    </style>
</head>

<body>
<div class="app-shell">

    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'tasks:list' %}">
                <i class="fa-solid fa-database"></i>
                <span class="fw-semibold">Todo ORM Lab</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-light" href="{% url 'tasks:create' %}">
                            <i class="fa-solid fa-plus me-1"></i>新建任务
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-light" href="{% url 'tasks:create' %}?quick=1">
                            <i class="fa-solid fa-bolt me-1"></i>快速创建(objects.create)
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主体 -->
    <main class="app-main py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- 底部导航栏 -->
    <footer class="footerbar py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="small text-muted">
                <i class="fa-regular fa-circle-check me-1"></i>
                CRUD Lab · Django 5 + Bootstrap 5
            </div>
            <div class="small text-muted">
                <span class="me-2">快捷键思维：</span>
                <span class="badge text-bg-dark border" style="border-color:var(--line)!important;">Create</span>
                <span class="badge text-bg-dark border" style="border-color:var(--line)!important;">Read</span>
                <span class="badge text-bg-dark border" style="border-color:var(--line)!important;">Update</span>
                <span class="badge text-bg-dark border" style="border-color:var(--line)!important;">Delete</span>
            </div>
        </div>
    </footer>

</div>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
