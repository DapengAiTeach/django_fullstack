{% extends "base.html" %}
{% block title %}删除任务 · Todo ORM Lab{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <div class="h5 mb-2">确认删除</div>
                <div class="text-muted mb-3">
                    Delete 演示：<code>task.delete()</code> 会生成 <code>DELETE FROM ... WHERE id=</code>
                </div>

                <div class="border rounded p-3 mb-3" style="border-color:var(--line)!important;">
                    <div class="fw-semibold">{{ task.title }}</div>
                    {% if task.description %}
                        <div class="text-muted small mt-1">{{ task.description }}</div>
                    {% endif %}
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button class="btn btn-light text-dark" type="submit">
                            <i class="fa-regular fa-trash-can me-1"></i>确认删除
                        </button>
                        <a class="btn btn-outline-light" href="{% url 'tasks:list' %}">
                            取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
