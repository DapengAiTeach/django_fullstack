{% extends "movies/base.html" %}
{% block title %}导演列表{% endblock %}
{% block content %}
<div class="card card-tech p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0"><i class="fa-solid fa-users me-2"></i>导演列表</h5>
    <span class="text-muted-tech small">annotate：Count("movies")（反向统计）</span>
  </div>

  <div class="list-group list-group-flush">
    {% for d in directors %}
      <a class="list-group-item list-group-item-action bg-transparent text-white border-secondary"
         href="{% url 'movies:director_detail' d.pk %}">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold">{{ d.name }}</div>
          <div class="text-muted-tech">
            <i class="fa-solid fa-film me-1"></i>{{ d.movie_count }} 部
          </div>
        </div>
      </a>
    {% empty %}
      <div class="text-muted-tech p-4">暂无数据</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
