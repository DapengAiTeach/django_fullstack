{% extends "shop/base.html" %}
{% block title %}下单{% endblock %}
{% block content %}
<div class="card card-tech p-4">
  <h5 class="mb-2"><i class="fa-solid fa-cart-plus me-2 text-primary"></i>创建订单</h5>
  <p class="text-muted-tech mb-3">
    商品：<b>{{ product.name }}</b> · 当前库存：<span class="badge badge-soft">{{ product.stock }}</span>
  </p>

  <form method="post" class="vstack gap-3">
    {% csrf_token %}
    <div>
      <label class="form-label text-muted-tech">{{ form.quantity.label }}</label>
      {{ form.quantity }}
      <div class="form-text text-muted-tech">
        下单会在事务内：select_for_update 锁库存行 + F 表达式原子扣减
      </div>
    </div>
    <button class="btn btn-primary">
      <i class="fa-solid fa-check me-2"></i>提交下单
    </button>
  </form>
</div>
{% endblock %}
