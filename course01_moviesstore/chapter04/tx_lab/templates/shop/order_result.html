{% extends "shop/base.html" %}
{% block title %}下单结果{% endblock %}
{% block content %}
<div class="card card-tech p-4">
  {% if ok %}
    <h5 class="mb-2 text-success"><i class="fa-solid fa-circle-check me-2"></i>成功</h5>
  {% else %}
    <h5 class="mb-2 text-danger"><i class="fa-solid fa-circle-xmark me-2"></i>失败</h5>
  {% endif %}
  <p class="text-muted-tech mb-0">{{ msg }}</p>
  <div class="mt-3">
    <a class="btn btn-outline-primary" href="{% url 'shop:product_list' %}">返回列表</a>
  </div>
</div>
{% endblock %}
