{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="text-center mb-3">电影后台登录</h4>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100">登录</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
