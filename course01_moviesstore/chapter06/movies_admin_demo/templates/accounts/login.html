{% extends "base.html" %}
{% block title %}登录 · Movies Admin Demo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card card-soft p-4">
      <h4 class="fw-bold mb-1">登录</h4>
      <p class="text-muted mb-4">用于前台演示页面交互（Admin 登录在 /admin 与 /ops）。</p>

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>

        <div class="mb-3">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger">
            用户名或密码错误，请重试。
          </div>
        {% endif %}

        <button class="btn btn-tech text-white w-100" type="submit">
          <i class="fa-solid fa-right-to-bracket me-1"></i>登录
        </button>

        <div class="text-center mt-3">
          <a class="text-decoration-none" href="{% url 'movies:register' %}">没有账号？去注册</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
