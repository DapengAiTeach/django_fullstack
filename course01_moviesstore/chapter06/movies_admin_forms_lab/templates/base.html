<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin Forms Lab{% endblock %}</title>

  <!-- BootCDN：Bootstrap5 -->
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- BootCDN：FontAwesome6 -->
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    :root{
      --tech-blue:#1e66ff;
      --tech-blue-2:#eaf2ff;
      --ink:#0b1b3a;
    }
    body{ background: linear-gradient(180deg, var(--tech-blue-2), #ffffff 45%); color:var(--ink); }
    .navbar-tech{ background: rgba(255,255,255,.92); border-bottom: 1px solid rgba(30,102,255,.12); backdrop-filter: blur(10px); }
    .brand-dot{ width:10px;height:10px;border-radius:50%;background:var(--tech-blue);display:inline-block;margin-right:8px; }
    .card-soft{ border:1px solid rgba(30,102,255,.12); box-shadow: 0 10px 30px rgba(30,102,255,.08); }
    .btn-tech{ background: var(--tech-blue); border-color: var(--tech-blue); }
    .btn-tech:hover{ filter: brightness(.95); }
    footer{ border-top: 1px solid rgba(30,102,255,.12); background: rgba(255,255,255,.85); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-tech sticky-top">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">
      <span class="brand-dot"></span>Admin Forms Lab
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="topNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/admin/">
            <i class="fa-solid fa-screwdriver-wrench me-1"></i>Django Admin
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        {% if request.user.is_authenticated %}
          <li class="nav-item"><span class="nav-link"><i class="fa-solid fa-user me-1"></i>{{ request.user.username }}</span></li>
        {% else %}
          <li class="nav-item"><span class="nav-link text-muted">未登录</span></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="py-4">
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <div class="text-muted">© {{ now|date:"Y" }} Admin Forms Lab</div>
    <div class="text-muted"><i class="fa-solid fa-shield-halved me-1"></i>Tech Blue · Bright UI · Django5</div>
  </div>
</footer>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
