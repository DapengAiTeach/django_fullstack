{% extends "admin/base_site.html" %}
{% block content %}
<h2>{{ title }}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <h4>将要影响的电影：</h4>
  <ul>
    {% for m in movies %}
      <li>{{ m.title }}</li>
    {% endfor %}
  </ul>

  <input type="hidden" name="apply" value="1">
  <button type="submit" class="button default">确认执行</button>
  <a href="../" class="button cancel-link">取消</a>
</form>
{% endblock %}
