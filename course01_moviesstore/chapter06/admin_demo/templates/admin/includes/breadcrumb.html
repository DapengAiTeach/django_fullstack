{% load i18n %}
<nav aria-label="breadcrumb" class="admin-breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="{% url 'admin:index' %}">{% trans "首页" %}</a>
        </li>
        {% if cl %}
        <li class="breadcrumb-item">
            <a href="{{ cl.opts.app_config.get_urls.0 }}">{{ cl.opts.app_config.verbose_name }}</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">{{ cl.opts.verbose_name_plural }}</li>
        {% endif %}
    </ol>
</nav>
