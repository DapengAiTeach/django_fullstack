<nav class="navbar navbar-expand-lg bg-body-tertiary app-navbar">
    <div class="container align-items-center">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <i class="fa-solid fa-film text-primary"></i>
            MoviesStore
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavbar"

        </button>
        <div class="collapse navbar-collapse" id="appNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" aria-current="page" href="/">主页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path|slice:":7" == "/movies" %}active{% endif %}" href="/apps/movies/">影片</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path|slice:":11" == "/categories" %}active{% endif %}" href="/categories/">分类</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path|slice:":6" == "/about" %}active{% endif %}" href="/about/">关于</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path|slice:":8" == "/contact" %}active{% endif %}" href="/contact/">联系</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2"

                    <i class="fa-solid fa-moon" data-theme-icon></i>
                    <span class="d-none d-md-inline">主题</span>
                </button>
