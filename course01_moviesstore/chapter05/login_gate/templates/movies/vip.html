{% extends "base.html" %}
{% block title %}VIP页面 | Login Gate{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h4 class="mb-2"><i class="fa-solid fa-crown me-2 text-primary"></i>VIP 页面（已通过登录校验）</h4>
    <p class="text-secondary mb-3">
      你现在能看到这个页面，说明 <span class="mono">@login_required</span> 判断 <span class="mono">request.user.is_authenticated</span> 为 True。
    </p>

    <div class="alert alert-info shadow-sm mb-0">
      当前用户：<span class="mono">{{ user.username }}</span>
      <br>
      课堂重点：未登录访问此页会被重定向到 <span class="mono">LOGIN_URL</span> 并自动拼接 <span class="mono">next</span>。
    </div>
  </div>
</div>
{% endblock %}
