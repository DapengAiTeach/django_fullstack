<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MoviePerm{% endblock %}</title>

  <!-- Bootstrap 5 (bootcdn 国内友好) -->
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome 6 (bootcdn 国内友好) -->
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    :root{
      --brand:#2563eb;           /* 科技蓝 */
      --brand-soft:#eff6ff;      /* 明亮浅蓝 */
      --card-border:#e5e7eb;
    }
    body{ background: linear-gradient(180deg, var(--brand-soft), #ffffff 35%); }
    .navbar{ background: #ffffff; border-bottom: 1px solid var(--card-border); }
    .brand-badge{
      color: var(--brand);
      background: rgba(37,99,235,.08);
      border: 1px solid rgba(37,99,235,.2);
      padding: .25rem .6rem;
      border-radius: 999px;
      font-weight: 700;
    }
    .card{ border: 1px solid var(--card-border); border-radius: 16px; }
    .btn-brand{
      background: var(--brand);
      border-color: var(--brand);
    }
    .btn-brand:hover{ filter: brightness(.95); }
    footer{
      border-top: 1px solid var(--card-border);
      background: #ffffff;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'movies:movie_list' %}">
      <span class="brand-badge"><i class="fa-solid fa-shield-halved me-1"></i>MoviePerm</span>
      <span class="text-secondary small">权限实战演示</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'movies:movie_list' %}">
            <i class="fa-solid fa-film me-1"></i>电影库
          </a>
        </li>
      </ul>

      <div class="d-flex gap-2 align-items-center">
        {% if user.is_authenticated %}
          <span class="text-secondary small">
            <i class="fa-regular fa-user me-1"></i>{{ user.username }}
          </span>
          <a class="btn btn-outline-primary btn-sm" href="{% url 'logout' %}">
            <i class="fa-solid fa-right-from-bracket me-1"></i>退出
          </a>
        {% else %}
          <a class="btn btn-brand text-white btn-sm" href="{% url 'login' %}">
            <i class="fa-solid fa-right-to-bracket me-1"></i>登录
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow-1">
  <div class="container py-4">

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} shadow-sm" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</main>

<footer class="mt-auto">
  <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div class="text-secondary small">
      <i class="fa-solid fa-lock me-1"></i>Django 5 认证与授权实战（亮色科技蓝）
    </div>
    <div class="text-secondary small">
      <i class="fa-solid fa-code me-1"></i>Bootstrap5 + FontAwesome6
    </div>
  </div>
</footer>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
