{% extends "base.html" %}
{% block title %}登录 | MoviePerm{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3"><i class="fa-solid fa-right-to-bracket me-2 text-primary"></i>登录</h5>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>
          <button class="btn btn-brand text-white w-100" type="submit">
            <i class="fa-solid fa-key me-1"></i>进入系统
          </button>
        </form>
        <div class="text-secondary small mt-3">
          登录是 <b>Authentication</b>：确认“你是谁”。登录后按钮是否显示、能否提交操作，是 <b>Authorization</b>：确认“你能做什么”。
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
